kind = "mobile"
previewPath = "/"
title = "Ask Nearby"
description = "An AI agent app that lets users ask real-world questions (e.g. 'Is fuel available at this station?') and autonomously dispatches nearby humans to physically verify the answer. Features two sides: asking questions with live agent reasoning, and earning rewards by completing verification tasks nearby."
version = "1.0.0"
id = "artifacts/ask-nearby"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21495

[services.development]
run = "pnpm --filter @workspace/ask-nearby run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ask-nearby", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ask-nearby", "run", "serve" ]

[services.env]
PORT = "21495"
BASE_PATH = "/"
