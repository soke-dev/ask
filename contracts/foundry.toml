[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Escrow holds real money, so an unchecked arithmetic slip is a stolen balance.
# 0.8 reverts on overflow by default; this keeps that on everywhere.
via_ir = false

[fmt]
line_length = 100
tab_width = 4
